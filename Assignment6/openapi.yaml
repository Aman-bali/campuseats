openapi: 3.0.3
info:
  title: CampusEats Orders Service
  version: 2.0.0
  description: >
    Assignment 6 - honest responses. The HTTP status IS the result: no failure
    is ever sent as 200. Every failure is one shape, RFC 9457 Problem Details
    (application/problem+json, or application/problem+xml when the client
    asks for XML), with a stable `type`. Validation failures are 422 with an
    `errors` list naming each bad field.


    Representations: every endpoint returns application/json by default and
    application/xml when `Accept` asks for it; any other Accept gets 406.
    Every body is labelled `Content-Type: <type>; charset=utf-8`.


    Methods not listed for a path are not supported: `PATCH` and `DELETE` on
    `/orders` and `/orders/{orderId}` return 405 with an `Allow` header
    (cancelling is the sub-resource `POST /orders/{orderId}/cancellation`, and
    orders are never deleted - they stay readable for audit and refunds).


    Retry rules: GET is always safe to retry. `POST /orders` is safe to retry
    ONLY with the same Idempotency-Key. Retry only transient failures (429,
    503, network error/timeout), honouring `Retry-After`; never resend a 4xx
    unchanged.
servers:
  - url: http://localhost:5001
    description: Local development

paths:
  /orders:
    post:
      operationId: createOrder
      summary: Place an order (charges the Payments service)
      description: >
        Validates the whole body first (all errors reported together), then
        checks item availability, then charges Payments. Safely retryable with
        an Idempotency-Key: a repeat with the same key and body returns the
        original order (Idempotent-Replay header) and charges nothing.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderRequest'
      responses:
        '201':
          description: Order created and paid (also returned on an idempotent repeat).
          headers:
            Location:
              description: URL of the new order, e.g. /orders/ORD-0001.
              schema:
                type: string
            Idempotent-Replay:
              description: '"true" when this is a replay of an earlier request with the same key.'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            application/xml:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/OrderUnprocessable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: listOrders
      summary: List orders, filtered by query string
      parameters:
        - $ref: '#/components/parameters/Accept'
        - name: studentId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Matching orders (possibly empty).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
            application/xml:
              schema:
                $ref: '#/components/schemas/OrderList'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Read one order
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
            application/xml:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

  /orders/{orderId}/cancellation:
    post:
      operationId: createCancellation
      summary: Cancel an order (creates a cancellation sub-resource)
      description: >
        Only a `paid` order can be cancelled. Cancelling an already-cancelled
        order is an illegal state transition (409). Repeating the call after
        success therefore returns 409 - it never cancels twice.
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Accept'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancellationRequest'
      responses:
        '201':
          description: Order cancelled.
          headers:
            Location:
              description: URL of the cancellation record.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
            application/xml:
              schema:
                $ref: '#/components/schemas/Cancellation'
        '400':
          $ref: '#/components/responses/MalformedJson'
        '404':
          $ref: '#/components/responses/OrderNotFound'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '409':
          $ref: '#/components/responses/IllegalTransition'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      operationId: getCancellation
      summary: Read the cancellation record of an order
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/Accept'
      responses:
        '200':
          description: The cancellation record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cancellation'
            application/xml:
              schema:
                $ref: '#/components/schemas/Cancellation'
        '404':
          description: The order does not exist (`order-not-found`) or has no cancellation (`cancellation-not-found`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+xml:
              schema:
                $ref: '#/components/schemas/Problem'
        '406':
          $ref: '#/components/responses/NotAcceptable'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        example: ORD-0001
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-chosen unique key (e.g. a UUID) making the create safely retryable.
      schema:
        type: string
        maxLength: 128
    Accept:
      name: Accept
      in: header
      required: false
      description: >
        `application/json` (default, also for no header or */*) or
        `application/xml`. q-values are honoured. Anything else -> 406.
      schema:
        type: string
        example: application/xml

  headers:
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        example: 5

  responses:
    MalformedJson:
      description: The body is not parseable JSON (400, type `malformed-json`).
      content: &problemContent
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
        application/problem+xml:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Request body is not `application/json` (415, type `unsupported-media-type`).
      content: *problemContent
    NotAcceptable:
      description: >
        The Accept header names no representation we can produce (406, type
        `not-acceptable`). Always sent as application/problem+json.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OrderNotFound:
      description: No such order (404, type `order-not-found`).
      content: *problemContent
    IllegalTransition:
      description: >
        The order's current state does not allow this action (409, type
        `illegal-transition`), e.g. cancelling an order that is already cancelled.
      content: *problemContent
    ValidationFailed:
      description: >
        Well-formed but invalid input (422, type `validation-failed`). `errors`
        lists EVERY bad field and why.
      content: *problemContent
    OrderUnprocessable:
      description: >
        422 with one of these `type` values: `empty-cart` (items is empty; `errors`
        lists all bad fields), `validation-failed` (field errors), `item-unavailable`
        (an item is sold out), `payment-declined` (Payments refused the card),
        `idempotency-key-reused` (same key, different body).
      content: *problemContent
    TooManyRequests:
      description: Rate limit exceeded (429, type `rate-limited`). Wait `Retry-After` seconds, then retry.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content: *problemContent
    InternalError:
      description: >
        Unexpected server fault (500, type `internal-error`). The body contains a
        reference id only - never a stack trace or database message.
      content: *problemContent
    ServiceUnavailable:
      description: >
        Payments dependency unreachable after retries (503, type
        `payments-unavailable`). No order is stored; retry with the same key after
        `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content: *problemContent

  schemas:
    OrderStatus:
      type: string
      enum: [paid, cancelled]
    OrderItem:
      type: object
      required: [itemId, name, quantity, unitPrice]
      properties:
        itemId:
          type: string
          minLength: 1
          example: ITM-17
        name:
          type: string
          minLength: 1
          example: Masala Dosa
        quantity:
          type: integer
          minimum: 1
          maximum: 20
        unitPrice:
          type: string
          description: Positive decimal price snapshot taken from the Catalogue at order time.
          example: '60.00'
    OrderRequest:
      type: object
      required: [studentId, address, items, cardToken]
      properties:
        studentId:
          type: string
          minLength: 1
          example: S-20251651015
        address:
          type: string
          minLength: 1
          maxLength: 200
          description: Delivery address. Required.
          example: Hostel B, Room 214
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/OrderItem'
        cardToken:
          type: string
          pattern: '^tok_'
          description: Tokenised card. Forwarded to Payments, never echoed back.
          example: tok_4242c9a1b7
        currency:
          type: string
          minLength: 3
          maxLength: 3
          default: INR
    Order:
      type: object
      xml:
        name: order
      required: [id, studentId, address, items, total, currency, status, createdAt]
      properties:
        id:
          type: string
          example: ORD-0001
        studentId:
          type: string
        address:
          type: string
        items:
          type: array
          xml:
            name: items
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: string
          example: '120.00'
        currency:
          type: string
        status:
          $ref: '#/components/schemas/OrderStatus'
        createdAt:
          type: string
          format: date-time
        links:
          type: object
          properties:
            self:
              type: string
            cancellation:
              type: string
    OrderList:
      type: object
      xml:
        name: orderList
      required: [items, count]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        count:
          type: integer
    CancellationRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 200
          example: Changed my mind
    Cancellation:
      type: object
      xml:
        name: cancellation
      required: [orderId, reason, cancelledAt]
      properties:
        orderId:
          type: string
        reason:
          type: string
        cancelledAt:
          type: string
          format: date-time
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
          description: Path of the bad field, e.g. `address` or `items[0].quantity`.
          example: items[0].quantity
        message:
          type: string
          description: Why it is bad.
          example: must be an integer between 1 and 20
    Problem:
      type: object
      xml:
        name: problem
        namespace: urn:ietf:params:xml:ns:problem
      required: [type, title, status, detail]
      description: RFC 9457 Problem Details.
      properties:
        type:
          type: string
          description: >
            Stable identifier of the kind of failure. One of the slugs below,
            appended to https://campuseats.example.com/problems/ .
          x-problem-types: [empty-cart, item-unavailable, payment-declined, order-not-found,
            illegal-transition, validation-failed, idempotency-key-reused, cancellation-not-found,
            malformed-json, unsupported-media-type, not-acceptable, not-found, method-not-allowed,
            rate-limited, payments-unavailable, internal-error]
          example: https://campuseats.example.com/problems/empty-cart
        title:
          type: string
          description: Short, human-readable, the same for every occurrence of this type.
          example: Cart is empty
        status:
          type: integer
          description: Same number as the HTTP status line.
          example: 422
        detail:
          type: string
          description: Explanation of this occurrence.
          example: The order contains no items. Add at least one item.
        errors:
          type: array
          description: Present on 422 validation failures only.
          items:
            $ref: '#/components/schemas/FieldError'
